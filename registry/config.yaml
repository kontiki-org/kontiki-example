kontiki:
  http:
    address: 0.0.0.0
    port: 8082
  amqp:
    url: amqp://guest:guest@localhost/

logging:
  directory: logs
  handlers:
    file:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      maxBytes: 10485760
      backupCount: 5
  root:
    handlers: [file]
    level: INFO
